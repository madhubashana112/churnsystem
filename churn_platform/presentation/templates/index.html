<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Churn AI - Onboarding</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 h-screen flex flex-col justify-center items-center">

    <div class="bg-white p-8 rounded-lg shadow-lg w-96">
        <h1 class="text-2xl font-bold mb-6 text-gray-800 text-center">Tenant Onboarding</h1>
        
        <form id="onboard-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Company Name</label>
                <input type="text" id="company-name" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" required>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700">Sector</label>
                <select id="sector" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" required>
                    <option value="SaaS">SaaS (B2B/B2C)</option>
                    <option value="Telecom">Telecom & ISP</option>
                    <option value="FinTech">FinTech & Banking</option>
                </select>
            </div>

            <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700">
                Register & Continue
            </button>
        </form>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
