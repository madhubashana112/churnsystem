# pytest config lives here rather than in pyproject.toml on purpose: adding a
# pyproject.toml makes Vercel's Python build switch from requirements.txt to
# `uv lock`, which then fails for want of a [project] table. pytest.ini supports
# pythonpath (pytest 7+) and keeps the deployment build untouched.
#
# The repo has no __init__.py anywhere and relies on PEP 420 namespace packages;
# pythonpath makes imports work without changing that.
[pytest]
pythonpath = .
testpaths = tests
addopts = -q
filterwarnings =
    ignore::DeprecationWarning
